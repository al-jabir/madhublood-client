<!doctype html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#a61e35" />
    <meta
      name="description"
      content="MadhuBlood — voluntary blood donor coordination in Madhupur, Tangail."
    />
    <script>
      try {
        var saved = JSON.parse(
          localStorage.getItem("madhublood-preferences") || "null",
        );
        var preference = saved && saved.state;
        var dark =
          preference && typeof preference.dark === "boolean"
            ? preference.dark
            : matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        document.documentElement.classList.toggle("dark", dark);
        document.documentElement.lang =
          preference && preference.en === true ? "en" : "bn";
      } catch (_) {}
    </script>
    <link rel="stylesheet" href="/preloader.css" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>MadhuBlood — রক্তের বন্ধনে বাঁচুক জীবন</title>
  </head>
  <body>
    <div id="root">
      <div class="blood-loader boot-preloader" role="status" aria-live="polite">
        <div class="blood-loader-symbol" aria-hidden="true">
          <span class="blood-loader-orbit"></span
          ><svg viewBox="0 0 64 72" fill="none">
            <path
              d="M32 4C27 17 11 29 11 44a21 21 0 0 0 42 0C53 29 37 17 32 4Z"
              fill="currentColor"
            />
            <path
              d="m32 51-10-9c-7-7 2-16 10-8 8-8 17 1 10 8l-10 9Z"
              stroke="white"
              stroke-width="2.5"
              stroke-linejoin="round"
            />
          </svg>
        </div>
        <div class="blood-loader-copy">
          <strong>Madhu<span>Blood</span></strong>
          <p>
            <span class="boot-copy-bn">আপনার জন্য প্রস্তুত হচ্ছে…</span
            ><span class="boot-copy-en">Getting things ready for you…</span>
          </p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
